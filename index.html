function starField(count){
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  for(let i=0;i<count*3;i++) pos[i] = (Math.random()-0.5)*900;
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const m = new THREE.PointsMaterial({color:0xffffff, size:0.7, sizeAttenuation:true});
  return new THREE.Points(g, m);
}
scene.add(starField(6000));

sun.position.set(5, 2, 5);

// --- текстуры Земли (официальные примеры three.js) ---
const loader = new THREE.TextureLoader();

const earthMat = new THREE.MeshPhongMaterial({
  map: dayMap,
  bumpMap: bumpMap,
  bumpScale: 0.02,
  specularMap: specMap,
  specular: new THREE.Color(0x333333),
  shininess: 8
});
const earth = new THREE.Mesh(earthGeo, earthMat);

});

// --- ночные огни городов (видны на тёмной стороне, ярче при приближении) ---
const nightMap = loader.load(TEX + 'earth_lights_2048.png');
const nightMat = new THREE.ShaderMaterial({
  uniforms: { nightTex:{value:nightMap}, sunDirection:{value:new THREE.Vector3(1,0,0)} },
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vNormalW;
    void main(){
      vUv = uv;
      vNormalW = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`,
  fragmentShader: `
    uniform sampler2D nightTex;
    uniform vec3 sunDirection;
    varying vec2 vUv;
    varying vec3 vNormalW;
    void main(){
      float night = clamp(-dot(vNormalW, sunDirection), 0.0, 1.0);
      vec4 lights = texture2D(nightTex, vUv);
      gl_FragColor = vec4(lights.rgb, lights.r * night);
    }`,
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
});
const nightMesh = new THREE.Mesh(new THREE.SphereGeometry(1.001, 64, 64), nightMat);
earth.add(nightMesh); // дочерний — вращается вместе с Землёй

// --- атмосферное свечение (fresnel-шейдер, дёшево и красиво) ---

  uniforms: {},

    varying vec3 vNormal;
    void main(){
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`,
  fragmentShader: `
    varying vec3 vNormal;
    void main(){
      float i = pow(0.65 - dot(vNormal, vec3(0,0,1.0)), 3.0);
      gl_FragColor = vec4(0.3,0.6,1.0,1.0) * i;

  blending: THREE.AdditiveBlending,

});

function latLonToVec3(lat, lon, r){
  const phi = (90 - lat) * Math.PI/180;
  const theta = (lon + 180) * Math.PI/180;
  return new THREE.Vector3(
    -r*Math.sin(phi)*Math.cos(theta),
     r*Math.cos(phi),
     r*Math.sin(phi)*Math.sin(theta)
  );
}

// --- при загрузке/обновлении карты в центре обзора — Москва ---
{
  const moscowDir = latLonToVec3(CITIES[0][1], CITIES[0][2], 1);

}

// кэш текстур флагов (эмодзи → material), чтобы не плодить canvas на каждый маркер
const flagMatCache = {};
function getFlagMaterial(emoji){
  if(flagMatCache[emoji]) return flagMatCache[emoji];
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.font = '46px "Segoe UI Emoji","Noto Color Emoji",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(emoji, 32, 34);
  const mat = new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c), transparent:true, depthTest:false});
  flagMatCache[emoji] = mat;
  return mat;
}

// --- подсказка при наведении: страна + флаг ---
const tooltip = document.createElement('div');
tooltip.style.cssText = 'position:fixed;pointer-events:none;display:none;z-index:20;'+
  'background:rgba(0,20,40,.9);color:#fff;font:13px sans-serif;padding:6px 10px;'+
  'border-radius:6px;border:1px solid rgba(255,255,255,.25);white-space:nowrap';
document.body.appendChild(tooltip);
const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();
const hitMeshes = [];

const DOT_COLORS = {city:0xff5555, landmark:0xffd76a, ru:0x66ccff, plant:0x66ffa3};
// уровень значимости для LOD подписей: 0 — крупнейшие/столицы (видны всегда),
// 1 — прочие мировые города, 2 — достопримечательности и электростанции, 3 — региональные города РФ (видны только вблизи)
function tierOf(kind, isCapital){
  if(kind === 'city') return isCapital ? 0 : 1;
  if(kind === 'landmark' || kind === 'plant') return 2;
  return 3; // ru
}
const markers = []; // {dot, label, dir, tier}
function addMarker(name, lat, lon, kind, country, flag, isCapital){
  const tier = tierOf(kind, isCapital);
  const dir = latLonToVec3(lat, lon, 1).normalize();
  const pos = dir.clone().multiplyScalar(1.003);

  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.007, 8, 8),
    new THREE.MeshBasicMaterial({color: DOT_COLORS[kind]})
  );
  dot.position.copy(pos);
  earth.add(dot); // летит вместе с вращением Земли

  const div = document.createElement('div');
  div.className = 'city-label' + (kind !== 'city' ? ' ' + kind : '');
  div.textContent = name;
  const label = new THREE.CSS2DObject(div);
  label.position.set(0,0,0);
  dot.add(label);

  if(isCapital && flag){
    const flagSpr = new THREE.Sprite(getFlagMaterial(flag));
    flagSpr.scale.set(0.045, 0.045, 1);
    flagSpr.position.set(0, 0.028, 0); // флаг чуть выше точки столицы
    dot.add(flagSpr);
  }

  // увеличенная невидимая зона для удобного наведения мышью
  const hit = new THREE.Mesh(
    new THREE.SphereGeometry(0.022, 8, 8),
    new THREE.MeshBasicMaterial({visible:false})
  );
  hit.userData = {name, country, flag};
  dot.add(hit);
  hitMeshes.push(hit);

  markers.push({dot, label, dir, tier});
}
CITIES.forEach(([n,lat,lon,country,flag,cap]) => addMarker(n,lat,lon,'city',country,flag,cap));
LANDMARKS.forEach(([n,lat,lon,country,flag]) => addMarker(n,lat,lon,'landmark',country,flag));
PLANTS.forEach(([n,lat,lon,country,flag]) => addMarker(n,lat,lon,'plant',country,flag));

renderer.domElement.addEventListener('mousemove', (e) => {
  mouseNDC.x = (e.clientX/innerWidth)*2 - 1;
  mouseNDC.y = -(e.clientY/innerHeight)*2 + 1;
  raycaster.setFromCamera(mouseNDC, camera);
  const hits = raycaster.intersectObjects(hitMeshes, false).filter(h => h.object.parent.visible);
  if(hits.length){
    const d = hits[0].object.userData;
    tooltip.innerHTML = `${d.flag||''} <b>${d.name}</b>` + (d.country ? ' — '+d.country : '');
    tooltip.style.left = (e.clientX+14)+'px';
    tooltip.style.top  = (e.clientY+14)+'px';
    tooltip.style.display = 'block';
    renderer.domElement.style.cursor = 'pointer';
  } else {
    tooltip.style.display = 'none';
    renderer.domElement.style.cursor = 'default';
  }
});

// скрываем подписи и точки, ушедшие на обратную сторону глобуса;
// видимость подписей (но не точек) дополнительно зависит от масштаба и значимости объекта
const camDir = new THREE.Vector3();
function updateMarkers(){
  camDir.copy(camera.position).normalize();
  const dist = camera.position.length(); // расстояние камеры до центра Земли (Земля всегда в начале координат)
  const maxTier = dist < 2.0 ? 3 : dist < 2.8 ? 2 : dist < 4.2 ? 1 : 0;
  for(const m of markers){
    const worldDir = m.dir.clone().applyQuaternion(earth.quaternion);
    const facing = worldDir.dot(camDir) > 0.1;
    m.label.element.style.opacity = (facing && m.tier <= maxTier) ? '1' : '0';
    m.dot.visible = facing;
  }
}

// --- спутники: летают в мировых координатах, не привязаны к вращению Земли ---
const satGroup = new THREE.Group();
scene.add(satGroup);
const satellites = [];
function orbitPoint(radius, incl, node, angle){
  const p = new THREE.Vector3(Math.cos(angle)*radius, 0, Math.sin(angle)*radius);
  p.applyAxisAngle(new THREE.Vector3(1,0,0), incl);
  p.applyAxisAngle(new THREE.Vector3(0,1,0), node);
  return p;
}
for(let i=0;i<6;i++){
  const radius = 1.35 + Math.random()*0.35;
  const incl = Math.random()*Math.PI;
  const node = Math.random()*Math.PI*2;
  const speed = 0.15 + Math.random()*0.25;
  const phase = Math.random()*Math.PI*2;

  const pts = [];
  for(let a=0;a<=64;a++) pts.push(orbitPoint(radius, incl, node, (a/64)*Math.PI*2));
  const line = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:0x3399ff, transparent:true, opacity:0.25})
  );
  satGroup.add(line);

  const sat = new THREE.Mesh(
    new THREE.BoxGeometry(0.014,0.014,0.014),
    new THREE.MeshStandardMaterial({color:0xdddddd, emissive:0x222222})
  );
  satGroup.add(sat);
  satellites.push({sat, radius, incl, node, speed, phase});
}
function updateSatellites(t){
  for(const s of satellites){
    s.sat.position.copy(orbitPoint(s.radius, s.incl, s.node, s.phase + t*s.speed));
  }
}

// --- рейсы: самолёты взлетают и садятся между городами (летят вместе с Землёй) ---
const FLIGHT_ROUTES = [
  [CITIES[0], CITIES[1]], [CITIES[2], CITIES[12]], [CITIES[3], CITIES[6]],
  [CITIES[4], CITIES[13]], [CITIES[9], CITIES[11]], [CITIES[7], CITIES[14]]
];
function makePlaneMesh(){
  const geo = new THREE.ConeGeometry(0.006, 0.024, 6);
  geo.rotateX(Math.PI/2);
  return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color:0xffffff, emissive:0x111111}));
}
const planes = FLIGHT_ROUTES.map(([from, to]) => {
  const a = latLonToVec3(from[1], from[2], 1).normalize();
  const b = latLonToVec3(to[1],   to[2],   1).normalize();
  const mesh = makePlaneMesh();
  earth.add(mesh);
  return {a, b, mesh, t: Math.random(), dur: 8 + Math.random()*4, alt: 0.12, forward: true};
});
const _p1 = new THREE.Vector3(), _p2 = new THREE.Vector3();
function updatePlanes(dt){
  for(const p of planes){
    p.t += dt / p.dur;
    if(p.t >= 1){ p.t = 0; p.forward = !p.forward; } // долетел — разворот на обратный рейс
    const from = p.forward ? p.a : p.b, to = p.forward ? p.b : p.a;
    const h = 1 + p.alt*Math.sin(Math.PI*p.t); // 0 в начале/конце = взлёт/посадка, макс в середине

    _p1.copy(from).lerp(to, p.t).normalize();
    p.mesh.position.copy(_p1).multiplyScalar(h);

    _p2.copy(from).lerp(to, Math.min(p.t+0.01,1)).normalize().multiplyScalar(h);
    p.mesh.lookAt(_p2);
  }
}

function buildSeaCraft(routes, color, size, kindLabel, durMin, durSpan){
  return routes.map(([from, to]) => {
    const a = latLonToVec3(from[0], from[1], 1).normalize();
    const b = latLonToVec3(to[0],   to[1],   1).normalize();
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(size[0], size[1], size[2]),
      new THREE.MeshStandardMaterial({color, emissive:0x111111})
    );
    earth.add(mesh);
    const hit = new THREE.Mesh(
      new THREE.SphereGeometry(size[2]*1.6, 8, 8),
      new THREE.MeshBasicMaterial({visible:false})
    );
    hit.userData = {name: kindLabel, country:'', flag:''};
    mesh.add(hit);
    hitMeshes.push(hit);
    return {a, b, mesh, t: Math.random(), dur: durMin + Math.random()*durSpan, forward: Math.random() < 0.5};
  });
}
const ships   = buildSeaCraft(SHIP_ROUTES,   0xdddddd, [0.010,0.006,0.022], 'Контейнеровоз', 20, 12);
const tankers = buildSeaCraft(TANKER_ROUTES, 0x2b2b2b, [0.013,0.008,0.030], 'Танкер',        24, 14);
const _s1 = new THREE.Vector3(), _s2 = new THREE.Vector3();
function updateSeaCraft(list, dt){
  for(const s of list){
    s.t += dt / s.dur;
    if(s.t >= 1){ s.t = 0; s.forward = !s.forward; } // дошёл до порта — обратный рейс
    const from = s.forward ? s.a : s.b, to = s.forward ? s.b : s.a;

    _s1.copy(from).lerp(to, s.t).normalize();
    s.mesh.position.copy(_s1).multiplyScalar(1.001); // чуть выше поверхности воды

    _s2.copy(from).lerp(to, Math.min(s.t+0.01,1)).normalize().multiplyScalar(1.001);
    s.mesh.lookAt(_s2);
  }
}
function updateShips(dt){ updateSeaCraft(ships, dt); updateSeaCraft(tankers, dt); }

// --- известные созвездия на дальней "небесной сфере" (координаты приближённые, для вида) ---

const skyGroup = new THREE.Group();

CONSTELLATIONS.forEach(c => {
  const pts = c.stars.map(([ra,dec]) => raDecToVec3(ra, dec, SKY_R));
  skyGroup.add(new THREE.Points(

// --- Солнечная система (расстояния/скорости стилизованы, не в масштабе) ---
const sunMesh = new THREE.Mesh(
  new THREE.SphereGeometry(3.5, 32, 32),
  new THREE.MeshBasicMaterial({color:0xffdd77})
);
sunMesh.position.set(-160, 15, -60);
scene.add(sunMesh);

// свечение вокруг Солнца (аддитивный спрайт с радиальным градиентом)
function makeGlowSprite(colorInner, colorOuter, size){
  const c = document.createElement('canvas'); c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0, colorInner); g.addColorStop(1, colorOuter);
  ctx.fillStyle = g; ctx.fillRect(0,0,128,128);
  const mat = new THREE.SpriteMaterial({
    map:new THREE.CanvasTexture(c), blending:THREE.AdditiveBlending,
    transparent:true, depthWrite:false
  });
  const spr = new THREE.Sprite(mat);
  spr.scale.set(size,size,1);
  return spr;
}
sunMesh.add(makeGlowSprite('rgba(255,245,220,1)', 'rgba(255,150,40,0)', 24));
{
  const div = document.createElement('div');
  div.className = 'city-label planet';
  div.textContent = 'Солнце';
  const label = new THREE.CSS2DObject(div);

}

// направление реального света Земли согласуем с положением Солнца
sun.position.copy(sunMesh.position).normalize().multiplyScalar(5);
nightMat.uniforms.sunDirection.value.copy(sunMesh.position).normalize();

const PLANETS = [
  {name:'Меркурий', color:0x9c9c9c, size:0.05, dist:14,  speed:0.09},
  {name:'Венера',   color:0xd9b38c, size:0.12, dist:19,  speed:0.065},
  {name:'Марс',     color:0xc1440e, size:0.09, dist:28,  speed:0.045},
  {name:'Юпитер',   color:0xd8ac6c, size:0.9,  dist:55,  speed:0.02},

  {name:'Уран',     color:0x9fd6e0, size:0.35, dist:110, speed:0.01},
  {name:'Нептун',   color:0x4166f5, size:0.34, dist:140, speed:0.008}
];
const solarBodies = [];
PLANETS.forEach(p => {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(p.size, 24,24), new THREE.MeshBasicMaterial({color:p.color}));
  scene.add(mesh);
  if(p.rings){
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(p.size*1.4, p.size*2.2, 48),
      new THREE.MeshBasicMaterial({color:0xcbb88a, side:THREE.DoubleSide, transparent:true, opacity:0.6})

  const div = document.createElement('div');

});

// --- Луна: вращается вокруг Земли ---
const moon = new THREE.Mesh(
  new THREE.SphereGeometry(0.27, 32, 32),
  new THREE.MeshStandardMaterial({color:0xaaaaaa, roughness:1, metalness:0})
);
scene.add(moon);
{
  const div = document.createElement('div');
  div.className = 'city-label planet';
  div.textContent = 'Луна';
  const label = new THREE.CSS2DObject(div);
  label.position.set(0, 0.27+0.15, 0);
  moon.add(label);
}
const moonOrbit = {dist:2.6, speed:0.18, incl:0.09, phase:Math.random()*Math.PI*2};
function updateMoon(t){
  const a = moonOrbit.phase + t*moonOrbit.speed;
  moon.position.set(
    Math.cos(a)*moonOrbit.dist,
    Math.sin(a)*moonOrbit.dist*Math.sin(moonOrbit.incl),
    Math.sin(a)*moonOrbit.dist*Math.cos(moonOrbit.incl)
  );
}

// --- клик по Земле/Луне/Солнцу/планете — сделать её центром вращения камеры ---
const selectable = [
  {mesh: earth, name:'Земля', size:1, isEarth:true},
  {mesh: moon,  name:'Луна',  size:0.27},
  {mesh: sunMesh, name:'Солнце', size:3.5},
  ...solarBodies.map((b,i) => ({mesh:b.mesh, name:PLANETS[i].name, size:PLANETS[i].size}))
];
let focused = selectable[0];
renderer.domElement.addEventListener('click', (e) => {
  mouseNDC.x = (e.clientX/innerWidth)*2 - 1;
  mouseNDC.y = -(e.clientY/innerHeight)*2 + 1;
  raycaster.setFromCamera(mouseNDC, camera);
  const hits = raycaster.intersectObjects(selectable.map(s => s.mesh), false);
  if(!hits.length) return;
  const target = selectable.find(s => s.mesh === hits[0].object);
  if(!target || target === focused) return;
  const delta = new THREE.Vector3().subVectors(target.mesh.position, controls.target);
  camera.position.add(delta);
  controls.target.copy(target.mesh.position);
  controls.minDistance = target.size*1.4 + 0.05;
  controls.maxDistance = target.isEarth ? 260 : Math.max(target.size*60, 15);
  autoRotate = !!target.isEarth;
  focused = target;
});
function updatePlanets(t){
  solarBodies.forEach(b => {
    const a = b.phase + t*b.speed;
    b.mesh.position.set(Math.cos(a)*b.dist, 0, Math.sin(a)*b.dist);
  });
}

// --- усиление деталей поверхности при приближении камеры к Земле ---
function updateEarthDetail(){
  const dist = camera.position.length();
  const close = THREE.MathUtils.clamp(1 - (dist - 1.4)/3, 0, 1); // 1 у поверхности, 0 дальше 4.4
  earthMat.bumpScale = 0.02 + close*0.03;
  earthMat.shininess = 8 + close*24;
  cloudMat.opacity = 0.35 + close*0.1;
}

// --- анимация ---
let autoRotate = true;
let idleTimer = 0;
controls.addEventListener('start', () => { autoRotate = false; });
controls.addEventListener('end',   () => { idleTimer = 0; });

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  if(!controls.enabled) return;
  const dt = clock.getDelta();
  if(autoRotate) earth.rotation.y += 0.0009;
  else {
    idleTimer++;
    if(idleTimer > 240) autoRotate = true; // возобновить через ~4с бездействия
  }
  clouds.rotation.y += 0.0013;
  updateSatellites(clock.elapsedTime);
  updatePlanes(dt);
  updateShips(dt);
  updatePlanets(clock.elapsedTime);
  updateMoon(clock.elapsedTime);
  // если центр — движущееся тело (Луна/планета), камера следует за ним, сохраняя ракурс
  if(!focused.isEarth){
    const delta = new THREE.Vector3().subVectors(focused.mesh.position, controls.target);
    camera.position.add(delta);
    controls.target.add(delta);
  }
  controls.update();
  updateMarkers();
  updateEarthDetail();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
animate();

// --- ресайз окна ---
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});
</script>
