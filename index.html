<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Земля 3D</title>
<style>
  html,body{margin:0;overflow:hidden;background:#000;height:100%}
  canvas{display:block}
  #hint{position:fixed;bottom:14px;left:14px;color:#8fa;font:12px monospace;
    opacity:.6;user-select:none;pointer-events:none}
  :root{--city-text:#ffeded;--city-bg:#001428;--capital-text:#ffd76a;--capital-bg:#001428}
  .city-label{color:var(--city-text);font:11px/1.2 sans-serif;background:var(--city-bg);
    padding:2px 6px;border-radius:4px;white-space:nowrap;pointer-events:none;
    transition:opacity .15s;border:1px solid rgba(255,255,255,.15)}
  .city-label.capital{color:var(--capital-text);background:var(--capital-bg)}
  .city-label.landmark{color:#ffd76a;border-color:rgba(255,215,106,.35)}
  .city-label.ru{color:#009dff;background:rgba(128,138,148,.20);border:none}
  .city-label.city2{color:#009dff;background:rgba(128,138,148,.20);border:none}
  .city-label.plant{color:#7cffb2;border-color:rgba(124,255,178,.4)}
  .city-label.planet{color:#c9a9ff;border-color:rgba(201,169,255,.4);font-weight:600}
  .city-label.cosmodrome{color:#ff8a5c;border-color:rgba(255,138,92,.4)}
  .city-label.constellation-label{color:#7d8fb3;background:rgba(0,20,40,.3);border-color:rgba(125,143,179,.25);font-weight:400;letter-spacing:.5px}
  .city-label.star{color:#ffe9a8;background:rgba(0,20,40,.4);border-color:rgba(255,204,51,.3);font-size:10px}
</style>
</head>
<body>
<div id="hint">ЛКМ — вращение · колесо — зум (отдалитесь — увидите Солнечную систему) · ПКМ — пан · клик по планете/Луне/Солнцу — сделать её центром</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
